
site:
  id: default
  name: "My Location"
  log_level: INFO

cameras:
  - name: "webcam"
    source: "0"
    enabled: true
  - name: "v720"
    source: "v720://192.168.169.1:6123"
    enabled: false
detection:
  model_name: "yolo11s.pt"
  confidence_threshold: 0.5
  association_distance: 200.0  # max pixels to associate an object with a person

tracking:
  departure_seconds: 10.0
  companion_distance: 200.0
  summary_interval: 60.0        # seconds between periodic track summaries to AI
  quiet_hours:
    start: "21:00"
    end: "06:00"

redis:
  enabled: true
  host: localhost       # overridden by REDIS_HOST in .env
  port: 6379            # overridden by REDIS_PORT in .env
  db: 0

storage:
  db_path: "data/stangwatch.db"
  cloud_sync: false
  cloud_provider: ""
  cloud_url: ""

cloud:
  enabled: false
  api_url: ""                # https://api.eyesofhorus.com
  api_key: ""                # device API key (sk_device_xxx)
  sync_interval: 30          # seconds between sync cycles
  heartbeat_interval: 60     # seconds between heartbeat pushes

alerts:
  cooldown_seconds: 60.0
  language: en

agent:
  enabled: true
  model: "qwen2.5:7b"                          # local Ollama model (offline fallback)
  vision_model: "qwen2.5vl:7b"                 # local vision model (offline fallback)
  text_provider: "groq"                          # "groq" | "openrouter" | "ollama"
  vision_provider: "groq"                       # "groq" | "openrouter" | "gemini" | "ollama"
  timeout_seconds: 60.0
  cooldown_seconds: 120.0
escalation:
  enabled: true
  roles:
    - name: guard
      level: 1
      abilities: [acknowledge, mute_1h]
    - name: supervisor
      level: 2
      abilities: [acknowledge, mute_8h]
    - name: admin
      level: 3
      abilities: [acknowledge, configure, mute_permanent]

  policies:
    - severity: medium
      chain:
        - role: guard
          timeout_minutes: 5
        - role: supervisor
          timeout_minutes: 10
        - role: admin

    - severity: high
      chain:
        - role: guard
          timeout_minutes: 2
        - role: admin
