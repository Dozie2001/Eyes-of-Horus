# Eyes of Horus Edge Device Stack
# Run from project root: docker compose -f docker/docker-compose.yml up -d
# Or from docker/: docker compose up -d
# Everything starts automatically — no manual setup needed.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_HOST=redis
      # Cloud provider keys — read from .env, passed to container
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - app_data:/app/data
      - ../.env:/app/.env:ro
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot service: pulls the text model then exits.
  # The app waits for this to finish before starting.
  # Vision model pull is skipped — cloud providers (Groq/OpenRouter) are
  # preferred for vision. To use local Ollama vision, add:
  #   ollama pull qwen2.5vl:7b
  ollama-pull:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling text model (qwen2.5:7b)..."
        ollama pull qwen2.5:7b
        echo "Models ready."
    restart: "no"

volumes:
  app_data:
  redis_data:
  ollama_data:
