# Eyes of Horus Edge Device Stack
# Run: docker compose up -d
# Everything starts automatically — no manual setup needed.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_HOST=redis
    volumes:
      - app_data:/app/data
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot service: pulls the model then exits.
  # The app waits for this to finish before starting.
  ollama-pull:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling text model (qwen2.5:7b)..."
        ollama pull qwen2.5:7b
        echo "Models ready."
    restart: "no"

volumes:
  app_data:
  redis_data:
  ollama_data:
